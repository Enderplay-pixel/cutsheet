services:
  - type: web
    name: cutsheet
    runtime: node
    region: frankfurt
    plan: free
    # Chromium explizit installieren: der PDF-Export braucht es zur Laufzeit,
    # und .puppeteerrc.cjs legt es ins Projektverzeichnis, damit es den Deploy
    # übersteht (der HOME-Cache tut das nicht).
    buildCommand: npm install && npx puppeteer browsers install chrome && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Muss zum cacheDir aus .puppeteerrc.cjs passen, sonst sucht puppeteer
      # zur Laufzeit wieder im HOME-Cache
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false   # optional – needed for AI features
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false
      # YouTube-Anbindung (optional) — im Dashboard setzen
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
